<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❤️ Mano ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#000;
color:#fff;
overflow:hidden;
text-align:center;
}

.page{
display:none;
width:100%;
height:100vh;
justify-content:center;
align-items:center;
flex-direction:column;
padding:20px;
animation:fade 1s;
}

#login{
display:flex;
}

input{
width:250px;
padding:15px;
border:none;
border-radius:15px;
font-size:18px;
text-align:center;
}

button{
margin-top:20px;
padding:12px 30px;
border:none;
border-radius:15px;
background:#ff4d6d;
color:white;
font-size:18px;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.05);
}

#error{
margin-top:15px;
color:#ff5b5b;
}

.message{
max-width:700px;
font-size:20px;
line-height:1.5;
padding:10px;
}

.next{
margin-top:20px;
}

.photo{
display:none;
flex-direction:column;
align-items:center;
justify-content:center;
height:100vh;
animation:zoom 1s;
}

.photo img{
width:280px;
max-width:90%;
border-radius:20px;
box-shadow:0 0 25px rgba(255,255,255,.25);
}

.emoji{
font-size:40px;
margin-top:15px;
}

@keyframes fade{
from{opacity:0;}
to{opacity:1;}
}

@keyframes zoom{
from{
opacity:0;
transform:scale(.8);
}
to{
opacity:1;
transform:scale(1);
}
}

.heart{
position:fixed;
bottom:-30px;
pointer-events:none;
animation:fly 6s linear infinite;
}

@keyframes fly{
0%{
transform:translateY(0);
opacity:0;
}
20%{
opacity:1;
}
100%{
transform:translateY(-120vh);
opacity:0;
}
}

</style>

</head>

<body>

<div class="page" id="login">

<h2>🔒 Enter Password</h2>

<input id="pass" type="password" placeholder="Password">

<button onclick="check()">Open ❤️</button>

<p id="error"></p>

</div>

<div class="page" id="textPage">

<div class="message" id="msg"></div>

<button class="next" onclick="startPhotos()">
🎁 Open the Surprise
</button>

</div>

<div class="page" id="photoPage"><div class="photo">
<img src="IMG-20260305-WA0002.jpg">
<div class="emoji">💋</div>
</div>

<div class="photo">
<img src="IMG-20251024-WA0471_1779221268291.jpg">
<div class="emoji">🤍</div>
</div>

<div class="photo">
<img src="IMG_20260804_234614.jpg">
<div class="emoji">💙</div>
</div>

<div class="photo">
<img src="PXL_20260122_120828280.NIGHT.jpg">
<div class="emoji">💚</div>
</div>

<div class="photo">
<img src="PXL_20260731_214205224.jpg">
<div class="emoji">🖤</div>
</div>

</div>

<script>

const lines=[
"يمكن بنتخانق كتير، بس ده من حبي ليك... وبغير عليك أكتر ما تتخيل. 🤍",
"بصراحة كنت مستنية إنك إنت اللي تعملي الفيديو ده، بس إحنا واحد، ومش بحب أشوفك زعلان.",
"مهما حصل بينا، مقدرش على زعلك، ولا أحب أشوفك زعلان.",
"اعتبر الفيديو ده مصالحه عن أي حاجة مزعلاك... مع إن انا اللي زعلانه. 😂♥️",
"يلا بقى هسيبك مع الفيديو...",
"حاولت أحط أغنية بس فشلت🙂 بس كنت نفسي أحط (كل الكلام اللي جوايا).",
"I love you, Mano 💋♥️"
];

let i=0;

function check(){

if(document.getElementById("pass").value==="Mano"){

document.getElementById("login").style.display="none";
document.getElementById("textPage").style.display="flex";

showText();
hearts();

}else{

document.getElementById("error").innerHTML="❌ Password غلط";

}

}

function showText(){

if(i<lines.length){

document.getElementById("msg").innerHTML+=lines[i]+"<br><br>";

i++;

setTimeout(showText,1500);
function startPhotos(){

document.getElementById("textPage").style.display="none";
document.getElementById("photoPage").style.display="flex";

let photos=document.querySelectorAll(".photo");

let index=0;

function next(){

if(index>0){
photos[index-1].style.display="none";
}

if(index<photos.length){

photos[index].style.display="flex";

index++;

setTimeout(next,3000);

}else{

let end=document.createElement("h2");
end.innerHTML="🤍 Thank You For Watching 🤍<br><br>I Love You, Mano ❤️";
end.style.animation="fade 2s";
document.getElementById("photoPage").appendChild(end);

}

}

next();

}

function hearts(){

setInterval(()=>{

let h=document.createElement("div");

h.className="heart";

let emojis=["❤️","🤍","💕","💖","💋","🩵"];

h.innerHTML=emojis[Math.floor(Math.random()*emojis.length)];

h.style.left=Math.random()*100+"%";

h.style.fontSize=(20+Math.random()*20)+"px";

document.body.appendChild(h);

setTimeout(()=>{

h.remove();

},6000);

},350);

}

</script>

</body>
</html>
}

}
